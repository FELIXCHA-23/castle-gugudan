</style>

      '<div class="hero"><div class="hi">구구단 도전!</div><h1>캐슬 구구단</h1><div class="tip">로그인하면 점수가 차곡차곡 쌓여요.</div></div>' +

    tabs('game');
    var bs = $app.querySelectorAll('.seg button');
    for (var i = 0; i < bs.length; i++) bs[i].onclick = function () { BIGLV = +this.getAttribute('data-l'); drawBig(); };
    document.getElementById('go').onclick = start;
    document.getElementById('bk').onclick = home;
    document.getElementById('lo').onclick = GUEST ? function () { login('', 'in'); } : out;
  }
  function draw(board) {
    var all = picked.length === 0, chips = '';
    for (var d = 2; d <= 9; d++) chips += '<button data-d="' + d + '" class="' + (picked.indexOf(d) >= 0 ? 'on' : '') + '">' + d + '단</button>';
    $app.innerHTML = head(true) +
      '<div class="card"><h2>🎯 구구단 점수 도전</h2><div class="sub" style="margin-bottom:8px">30문제 · 연습할 단을 골라요.</div><h2 style="font-size:14px;color:var(--sub);margin-top:10px">연습할 단</h2><div class="sub">고르지 않으면 2단부터 9단까지 모두 나옵니다.</div><div class="dans">' + chips + '<button class="all ' + (all ? 'on' : '') + '" data-d="all">전체 (2~9단)</button></div></div>' +
      '<button class="cta" id="go">▶ 게임 시작</button><button class="cta ghost" id="bk">← 게임 고르기</button>';
    tabs('game');
    var bs = $app.querySelectorAll('.dans button');
    for (var i = 0; i < bs.length; i++) bs[i].onclick = function () {
      var v = this.getAttribute('data-d');
      if (v === 'all') picked = [];
      else { var n = +v, k = picked.indexOf(n); if (k >= 0) picked.splice(k, 1); else picked.push(n); if (picked.length === 8) picked = []; }
      draw(board);
    };
    document.getElementById('go').onclick = start;
    document.getElementById('bk').onclick = home;
    document.getElementById('lo').onclick = GUEST ? function () { login('', 'in'); } : out;
  }

  // ---------- 문제 만들기 ----------
  function deck() {
    var dans = picked.length ? picked.slice() : [2, 3, 4, 5, 6, 7, 8, 9], pool = [];
    dans.forEach(function (a) { for (var b = 2; b <= 9; b++) pool.push([a, b]); });
    var out = [];
    while (out.length < ROUNDS) {
      shuffle(pool);
      for (var i = 0; i < pool.length && out.length < ROUNDS; i++) {
        var last = out[out.length - 1];
        if (last && last[0] === pool[i][0] && last[1] === pool[i][1]) continue;
        out.push(pool[i]);
      }
    }
    return out;
  }
  function bigDeck(n, lv) {                   // 두 자리 × 한 자리 / 두 자리 × 두 자리 (10의 배수는 빼요)
    var out = [], last = null;
    function two() { var v; do { v = rnd(11, 99); } while (v % 10 === 0); return v; }
    while (out.length < n) {
      var a = two(), b = lv === 1 ? rnd(2, 9) : two();
      if (last && last[0] === a && last[1] === b) continue;
      last = [a, b]; out.push(last);
    }
    return out;
  }
  function choices(a, b) {                   // 정답 1개 + 헷갈리기 쉬운 오답 3개
    var ans = a * b, c = {}, cand = [a * (b + 1), a * (b - 1), (a + 1) * b, (a - 1) * b, ans + 10, ans - 10, ans + 2, ans - 2, ans + 1, ans - 1];
    if (ans >= 100) cand.push(ans + 20, ans - 20, ans + 100, ans - 100);
    shuffle(cand);
    var wrong = [];
    for (var i = 0; i < cand.length && wrong.length < 3; i++) {
      var v = cand[i];
      if (v > 0 && v !== ans && !c[v]) { c[v] = 1; wrong.push(v); }
    }
    return shuffle([ans].concat(wrong));
  }

  // ---------- 게임 ----------
  function start() {
    var go = document.getElementById('go'); if (go) go.disabled = true;
    function begin() {
      if (MODE === 'ta') {
        G = { mode: 'ta', n: TA_N, i: 0, right: 0, wrong: 0, last: null, t0: performance.now(), raf: 0, nt: 0, lock: false, over: false };
        showTA(); swTick(); return;
      }
      var mk = MODE === 'big' ? 'big' + BIGLV : 'dan', n = MODE === 'big' ? 10 : ROUNDS;
      G = { mode: mk, mult: MULT[mk], n: n, qs: MODE === 'big' ? bigDeck(n, BIGLV) : deck(), i: 0, score: 0, right: 0, combo: 0, maxCombo: 0, t0: 0, raf: 0, nt: 0, lock: false, paused: false, pend: [], fail: false };
      show();
    }
    function run() {
      if (GUEST) { begin(); return; }
      rpc(MODE === 'ta' ? 'gugu_ta_start' : 'gugu_start', { tok: TOKEN }).then(begin).catch(function (e) { if (e.login) lost(); else { if (go) go.disabled = false; } });
    }
    if (MODE === 'ta') countdown(run); else run();
  }
  function countdown(done) {               // 3 · 2 · 1 · 시작! (화면 가운데)
    var o = document.createElement('div'), seq = ['3', '2', '1', '시작!'], i = 0;
    o.className = 'cd'; document.body.appendChild(o);
    (function step() {
      if (i >= seq.length) { document.body.removeChild(o); done(); return; }
      var last = i === seq.length - 1;
      o.innerHTML = '<b' + (last ? ' class="go"' : '') + '>' + seq[i] + '</b>';
      i++; setTimeout(step, last ? 600 : 900);
    })();
  }
  function show() {
    var q = G.qs[G.i], a = q[0], b = q[1], opts = choices(a, b);
    G.ans = a * b; G.lock = false; G.limit = G.mode === 'dan' ? Math.max(MIN_SEC, START_SEC - G.combo) : BIG[G.mode].sec;
    var btn = '';
    opts.forEach(function (v) { btn += '<button data-v="' + v + '">' + v + '</button>'; });
    $app.innerHTML = head(false, true) +
      '<div class="hud"><span class="n"><b>' + (G.i + 1) + '</b> / ' + G.n + '</span><span class="tl" id="tl">' + G.limit + '초</span><span class="sc' + (G.score < 0 ? ' neg' : '') + '">' + fmt(G.score) + '<small>점</small></span></div>' +
      '<div class="tbar" id="tb"><i id="tf"></i></div>' +
      '<div class="card q' + (G.combo >= 10 ? ' hot hot2' : G.combo >= 3 ? ' hot' : '') + '"><div class="eq">' + a + '<span>×</span>' + b + '<span>=</span><em>?</em></div></div>' +
      '<div class="combo">' + (G.combo >= 1 ? '🔥 ' + G.combo + '연속 정답!' + (G.mode !== 'dan' ? '' : G.limit > MIN_SEC ? ' · 제한 시간 ' + G.limit + '초' : ' · 제한 시간 최소 ' + MIN_SEC + '초') : '') + '</div>' +
      '<div class="opts" id="op">' + btn + '</div><div class="fb" id="fb"></div>';
    var bs = document.querySelectorAll('#op button');
    for (var i = 0; i < bs.length; i++) bs[i].onclick = function () { answer(this); };
    document.getElementById('ex').onclick = askExit;
    G.t0 = performance.now();
    tick();
  }
  // 나가기: 시간을 멈추고 물어본 뒤, 나가면 시작 화면으로 (이미 푼 문제의 점수는 저장돼 있어요)
  function askExit() {
    if (!G || G.paused) return;
    G.paused = true; G.pauseAt = performance.now(); cancelAnimationFrame(G.raf); clearTimeout(G.nt);
    var o = document.createElement('div'); o.className = 'ovl'; o.id = 'ovl';
    o.innerHTML = '<div class="box"><h2>게임을 그만할까요?</h2><p>' + (GUEST ? '지금 푸는 문제는 점수에 들어가지 않아요.' : '지금까지 푼 문제의 점수는 저장돼요.<br>지금 푸는 문제는 점수에 들어가지 않아요.') + '</p>' +
      '<div class="two"><button id="keep">계속하기</button><button id="bye" class="red">나가기</button></div></div>';
    document.body.appendChild(o);
    document.getElementById('keep').onclick = function () {
      document.body.removeChild(o); G.paused = false;
      if (G.lock) G.nt = setTimeout(next, 300);
      else { G.t0 += performance.now() - G.pauseAt; tick(); }
    };
    document.getElementById('bye').onclick = function () {
      document.body.removeChild(o);
      var g = G; G = null;
      Promise.all(g.pend).then(function () { home(); }, function () { home(); });
    };
  }
  function next() { G.i++; if (G.i >= G.n) result(); else show(); }
  function tick() {
    var left = G.limit - (performance.now() - G.t0) / 1000;
    var f = document.getElementById('tf');
    if (!f || G.lock || G.paused) return;
    if (left <= 0) { f.style.transform = 'scaleX(0)'; answer(null); return; }
    f.style.transform = 'scaleX(' + (left / G.limit) + ')';
    var tl = document.getElementById('tl'); if (tl) tl.textContent = Math.ceil(left) + '초';
    document.getElementById('tb').className = 'tbar' + (left <= 1.6 ? ' low' : '');
    G.raf = requestAnimationFrame(tick);
  }
  // 연속 정답 효과: 2연속부터 화면에 콤보 글자, 5연속·10연속부터 더 크게 + 가장자리 불빛 + 불꽃
  function comboFx(n) {
    if (n < 2) return;
    var t = n >= 10 ? 3 : n >= 5 ? 2 : 1, b = document.body, els = [];
    var x = document.createElement('div'); x.className = 'cfx t' + t;
    x.innerHTML = '<b>' + n + ' COMBO!</b>' + (t === 3 ? '<small>🔥 멈출 수 없다! 🔥</small>' : t === 2 ? '<small>🔥 불타오른다!</small>' : '');
    els.push(x);
    if (t >= 2) { var f = document.createElement('div'); f.className = 'cfl t' + t; els.push(f); }
    if (t >= 2) for (var i = 0; i < (t === 3 ? 10 : 6); i++) {
      var p = document.createElement('div'), ang = Math.random() * Math.PI * 2, r = 70 + Math.random() * 90;
      p.className = 'cfp'; p.textContent = ['🔥', '✨', '⭐'][i % 3];
      p.style.left = (45 + Math.random() * 10) + '%'; p.style.top = '70%';
      p.style.setProperty('--dx', Math.round(Math.cos(ang) * r) + 'px'); p.style.setProperty('--dy', Math.round(Math.sin(ang) * r) + 'px');
      els.push(p);
    }
    els.forEach(function (e) { b.appendChild(e); });
    setTimeout(function () { els.forEach(function (e) { if (e.parentNode) e.parentNode.removeChild(e); }); }, 950);
    if (t >= 2 && navigator.vibrate) try { navigator.vibrate(t === 3 ? [25, 30, 25] : 25); } catch (e) {}
  }
  function answer(el) {
    if (G.lock || G.paused) return;
    G.lock = true; cancelAnimationFrame(G.raf);
    var win = G.mode === 'dan' ? FAST_SEC : BIG[G.mode].win;
    var left = Math.round(Math.max(0, 5 * (1 - (performance.now() - G.t0) / 1000 / win)) * 10) / 10;   // 빠르게 누른 만큼만 보너스 (0~5)
    var ok = !!el && +el.getAttribute('data-v') === G.ans, kind = ok ? 'ok' : el ? 'wrong' : 'timeout', d, fb = document.getElementById('fb');
    var op = document.getElementById('op'), bs = op.querySelectorAll('button');
    op.className = 'opts lock';
    for (var i = 0; i < bs.length; i++) if (+bs[i].getAttribute('data-v') === G.ans) bs[i].className = 'good';
    if (ok) {
      G.right++; G.combo++; G.maxCombo = Math.max(G.maxCombo, G.combo);
      d = Math.round((100 + Math.round(left * 20) + (G.combo >= 3 ? 20 : 0)) * G.mult);
      fb.className = 'fb ok'; fb.textContent = '정답! +' + d;
      comboFx(G.combo);
    } else {
      G.combo = 0; d = -Math.round((el ? 50 : 30) * G.mult); if (el) el.className = 'wrong';
      fb.className = 'fb bad'; fb.textContent = (el ? '아쉬워요! ' : '시간 초과! ') + d + '점 · 정답은 ' + G.ans;
      if (navigator.vibrate) try { navigator.vibrate(70); } catch (e) {}
    }
    G.score += d;
    var g = G;
    if (!GUEST) g.pend.push(rpc('gugu_answer', { tok: TOKEN, kind: kind, secs_left: left, p_mode: g.mode }).then(function (r) { ME.points = r.points; ME.best = r.best; }).catch(function (e) { if (e.login) g.lostLogin = true; g.fail = true; }));
    G.nt = setTimeout(next, PAUSE);
  }

  // ---------- 타임어택 ----------
  function swTick() {
    var g = G; if (!g || g.over || g.mode !== 'ta') return;
    var el = document.getElementById('sw'), t = ((performance.now() - g.t0) / 1000 + g.wrong * PEN).toFixed(1);
    if (el && el.getAttribute('data-t') !== t) { el.setAttribute('data-t', t); el.innerHTML = t + '<small>초</small>'; }
    g.raf = requestAnimationFrame(swTick);
  }
  function showTA() {
    var a, b;
    do { a = rnd(2, 9); b = rnd(2, 9); } while (G.last && G.last[0] === a && G.last[1] === b);
    G.last = [a, b]; G.ans = a * b; G.lock = false;
    var opts = choices(a, b), btn = '';
    opts.forEach(function (v) { btn += '<button data-v="' + v + '">' + v + '</button>'; });
    $app.innerHTML = head(false, true) +
      '<div class="hud"><span class="n">맞힌 <b>' + G.right + '</b> / ' + G.n + '</span><span class="sc" id="sw">0.0<small>초</small></span><span class="n">틀림 <b>' + G.wrong + '</b></span></div>' +
      '<div class="tbar"><i style="transform:scaleX(' + (G.right / G.n) + ')"></i></div>' +
      '<div class="card q"><div class="eq">' + a + '<span>×</span>' + b + '<span>=</span><em>?</em></div></div>' +
      '<div class="combo">틀리면 ' + PEN + '초가 더해져요</div>' +
      '<div class="opts" id="op">' + btn + '</div><div class="fb" id="fb"></div>';
    var bs = document.querySelectorAll('#op button');
    for (var i = 0; i < bs.length; i++) bs[i].onclick = function () { answerTA(this); };
    document.getElementById('ex').onclick = askExitTA;
  }
  function answerTA(el) {
    if (!G || G.lock || G.over) return;
    var g = G; g.lock = true;
    var ok = +el.getAttribute('data-v') === g.ans, fb = document.getElementById('fb'), op = document.getElementById('op'), bs = op.querySelectorAll('button');
    op.className = 'opts lock';
    for (var i = 0; i < bs.length; i++) if (+bs[i].getAttribute('data-v') === g.ans) bs[i].className = 'good';
    if (ok) {
      g.right++;
      if (g.right >= g.n) { finishTA(g); return; }
      fb.className = 'fb ok'; fb.textContent = '정답!';
      g.nt = setTimeout(function () { if (G === g) showTA(); }, 300);
    } else {
      g.wrong++; el.className = 'wrong';
      fb.className = 'fb bad'; fb.textContent = '아쉬워요! +' + PEN + '초 · 정답은 ' + g.ans;
      if (navigator.vibrate) try { navigator.vibrate(70); } catch (e) {}
      g.nt = setTimeout(function () { if (G === g) showTA(); }, 800);
    }
  }
  function askExitTA() {
    if (!G || G.over) return;
    var g = G, o = document.createElement('div'); o.className = 'ovl';
    o.innerHTML = '<div class="box"><h2>기록 도전을 그만할까요?</h2><p>시간은 계속 흘러요. 나가면 이번 기록은 사라져요.</p>' +
      '<div class="two"><button id="keep">계속하기</button><button id="bye" class="red">나가기</button></div></div>';
    document.body.appendChild(o);
    document.getElementById('keep').onclick = function () { document.body.removeChild(o); };
    document.getElementById('bye').onclick = function () {
      document.body.removeChild(o);
      g.over = true; cancelAnimationFrame(g.raf); clearTimeout(g.nt); if (G === g) G = null; home();
    };
  }
  function finishTA(g) {
    g.over = true; cancelAnimationFrame(g.raf); clearTimeout(g.nt);
    var mine = Math.round((performance.now() - g.t0) + g.wrong * PEN * 1000);
    if (GUEST) { resultTA(g, { ms: mine }); return; }
    rpc('gugu_ta_finish', { tok: TOKEN, wrongs: g.wrong }).then(function (r) { resultTA(g, r); })
      .catch(function (e) { if (e.login) lost(); else resultTA(g, { ms: mine, fail: true }); });
  }
  function resultTA(g, r) {
    var pen = g.wrong * PEN, bad = r.error || r.fail;
    $app.innerHTML = head(true) +
      '<div class="card"><div class="stars">⏱️</div><div class="sub" style="text-align:center;margin-bottom:10px">' + (g.wrong === 0 ? '하나도 안 틀렸어요! 대단해요!' : TA_N + '문제 완료!') + '</div>' +
      '<div class="big">' + secs(r.ms) + '</div><div class="sub" style="text-align:center;margin-top:2px">이번 기록' + (pen ? ' (벌칙 ' + pen + '초 포함)' : '') + '</div>' +
      '<div class="stat3"><div><b>' + g.wrong + '</b><span>틀린 문제</span></div><div><b>' + (r.rank ? r.rank + '위' : '-') + '</b><span>내 순위</span></div><div><b>' + (r.best ? secs(r.best) : '-') + '</b><span>내 최고 기록</span></div></div>' +
      (r.isNew ? '<div class="newrec">🎉 내 최고 기록이에요!</div>' : '') +
      (GUEST ? '<div class="warn" style="color:var(--gold)">로그인 없이 한 판이라 기록은 저장되지 않아요.</div>' : '') +
      (r.error ? '<div class="warn">기록이 인정되지 않았어요. 다시 도전해 봐요.</div>' : '') +
      (r.fail ? '<div class="warn">연결이 불안정해서 기록이 저장되지 않았을 수 있어요.</div>' : '') + '</div>' +
      '<button class="cta" id="again">↻ 다시 도전</button><button class="cta ghost" id="rk">순위 보기</button><button class="cta ghost" id="back">게임 고르기</button>';
    tabs('game');
    document.getElementById('again').onclick = start;
    document.getElementById('rk').onclick = function () { setup('ta'); };
    document.getElementById('back').onclick = home;
    document.getElementById('lo').onclick = GUEST ? function () { login('', 'in'); } : out;
  }

  // ---------- 결과 ----------
  function result() {
    Promise.all(G.pend).then(function () {
      if (G.lostLogin) { lost(); return; }
      var ROUNDS = G.n, rate = G.right / ROUNDS, st = rate >= 0.9 ? 3 : rate >= 0.7 ? 2 : rate >= 0.5 ? 1 : 0, s = '';
      for (var i = 0; i < 3; i++) s += '<span class="' + (i < st ? '' : 'off') + '">⭐</span>';
      var msg = G.right === ROUNDS ? '완벽해요! 구구단 박사!' : rate >= 0.7 ? '대단해요! 거의 다 맞혔어요.' : rate >= 0.5 ? '잘했어요! 조금만 더 연습해요.' : '괜찮아요. 다시 도전해 봐요!';
      $app.innerHTML = head(true) +
        '<div class="card"><div class="stars">' + s + '</div><div class="sub" style="text-align:center;margin-bottom:10px">' + msg + '</div>' +
        '<div class="big' + (G.score < 0 ? ' neg' : '') + '">' + fmt(G.score) + '<small>점</small></div><div class="sub" style="text-align:center;margin-top:2px">이번 판 점수</div>' +
        '<div class="stat3"><div><b>' + G.right + ' / ' + ROUNDS + '</b><span>맞힌 문제</span></div><div><b>' + G.maxCombo + '</b><span>최고 연속</span></div><div><b>' + (GUEST ? '-' : fmt(ME.points)) + '</b><span>누적 점수</span></div></div>' + (GUEST ? '<div class="warn" style="color:var(--gold)">로그인 없이 한 판이라 점수는 저장되지 않아요.</div>' : '') +
        (G.fail ? '<div class="warn">연결이 불안정해서 점수가 일부 저장되지 않았을 수 있어요.</div>' : '') + '</div>' +
        '<button class="cta" id="again">↻ 다시 하기</button>' + (GUEST ? '<button class="cta ghost" id="reg">가입하고 점수 모으기</button>' : '') + '<button class="cta ghost" id="back">처음으로</button>';
      tabs('game');
      document.getElementById('again').onclick = start;
      document.getElementById('back').onclick = home;
      document.getElementById('lo').onclick = GUEST ? function () { login('', 'in'); } : out;
      if (document.getElementById('reg')) document.getElementById('reg').onclick = function () { login('', 'up'); };
    });
  }

  // ---------- 시작 ----------
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}   // 브라우저가 로그인 정보를 함부로 지우지 않게 요청
  TOKEN = stored();
  if (TOKEN) store(TOKEN);
  if (TOKEN) home(); else login('');
})();
</script>
</body>
