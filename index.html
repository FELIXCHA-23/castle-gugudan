<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="dark">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="캐슬 구구단">
<meta name="theme-color" content="#0B0C0F">
<title>캐슬 구구단</title>
<link rel="icon" type="image/png" href="logo_mark.png">
<link rel="apple-touch-icon" href="logo_mark.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{--bg:#0B0C0F;--card:#15171C;--ink:#F3F1EC;--sub:#9C9DA6;--line:rgba(255,255,255,.085);--main:#E1262D;--gold:#CBAA6C;--ok:#4FBF8E;--bad:#FF6168;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;background:var(--bg)}
body{margin:0;min-height:100vh;color:var(--ink);font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;line-height:1.5;letter-spacing:-.01em;font-size:16px;word-break:keep-all;
  background:radial-gradient(ellipse 120% 46% at 50% -8%,rgba(225,38,45,.15) 0%,rgba(225,38,45,0) 62%),radial-gradient(ellipse 90% 40% at 100% 38%,rgba(203,170,108,.05) 0%,rgba(203,170,108,0) 60%),#0B0C0F;background-attachment:fixed;
  -webkit-user-select:none;user-select:none;touch-action:manipulation}
#app{max-width:520px;margin:0 auto;padding:18px 16px calc(32px + env(safe-area-inset-bottom,0px))}
button{font:inherit;font-weight:700;cursor:pointer;color:var(--ink);border:1px solid var(--line);background:var(--card);border-radius:12px;padding:12px 16px;transition:transform .06s,background .15s,opacity .15s}
button:active{transform:scale(.97)}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.brand{display:flex;align-items:center;gap:10px;font-size:17px;font-weight:700;letter-spacing:-.03em}
.brand img{width:34px;height:34px;display:block}
.card{background:linear-gradient(180deg,#181A20 0%,#14161B 100%);border:1px solid rgba(255,255,255,.07);border-radius:18px;padding:20px;margin-bottom:12px;box-shadow:0 1px 0 rgba(255,255,255,.045) inset,0 14px 34px rgba(0,0,0,.40)}
.hero{position:relative;overflow:hidden;background:linear-gradient(118deg,#1D1F26 0%,#121317 62%,#1A1B20 100%);border:1px solid rgba(255,255,255,.075);border-radius:18px;padding:22px 20px;margin-bottom:12px;box-shadow:0 1px 0 rgba(255,255,255,.06) inset,0 22px 48px rgba(0,0,0,.55)}
.hero:before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 96% 6%,rgba(225,38,45,.30),transparent 46%),radial-gradient(ellipse at 4% 110%,rgba(203,170,108,.12),transparent 50%);pointer-events:none}
.hero>*{position:relative}
.hero .hi{font-size:14.5px;color:var(--gold);letter-spacing:.04em;margin-bottom:6px}
.hero h1{margin:0;font-size:30px;line-height:1.26;font-weight:800;letter-spacing:-.045em}
.hero .tip{margin-top:10px;color:#B3B4BC;font-size:14px}
h2{font-size:17px;margin:0 0 4px;letter-spacing:-.02em}
.sub{color:var(--sub);font-size:13.5px}
.dans{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.dans button{padding:13px 0;font-size:17px;border-radius:10px;background:#0F1014;border-color:transparent}
.dans button.on{background:var(--ink);color:#0B0C0F;box-shadow:inset 0 -3px 0 var(--main)}
.dans button.all{grid-column:span 4;font-size:15.5px}
.cta{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;height:58px;border:none;border-radius:14px;font-size:18px;font-weight:700;color:#fff;background:linear-gradient(180deg,#EB323A 0%,#BD1820 100%);box-shadow:0 12px 28px rgba(225,38,45,.30),0 1px 0 rgba(255,255,255,.25) inset}
.cta.ghost{background:var(--card);border:1px solid var(--line);box-shadow:none;color:var(--ink);margin-top:10px}
.best{display:flex;align-items:center;gap:10px;color:#B3B4BC;font-size:14px}
.best b{color:var(--gold);font-size:20px;letter-spacing:-.03em}
/* 게임 화면 */
.hud{display:flex;align-items:center;justify-content:space-between;margin:4px 2px 10px;font-weight:700}
.hud .n{color:var(--sub);font-size:15px}.hud .n b{color:var(--ink)}
.hud .sc{font-size:22px;letter-spacing:-.03em;font-variant-numeric:tabular-nums}.hud .sc small{font-size:13px;color:var(--gold);margin-left:3px}
.tbar{height:12px;background:rgba(255,255,255,.08);border-radius:12px;overflow:hidden;margin-bottom:14px}
.tbar>i{display:block;height:100%;width:100%;border-radius:12px;background:linear-gradient(90deg,#CBAA6C,#E1262D);transform-origin:left}
.tbar.low>i{background:var(--bad)}
.q{text-align:center;padding:34px 10px 30px}
.q .eq{font-size:64px;font-weight:800;letter-spacing:-.04em;line-height:1.1;font-variant-numeric:tabular-nums}
.q .eq span{color:var(--gold);margin:0 .12em}
.q .eq em{font-style:normal;color:var(--sub)}
.combo{height:24px;text-align:center;color:var(--gold);font-weight:700;font-size:15px;margin:-4px 0 8px}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.opts button{height:92px;font-size:36px;font-weight:800;letter-spacing:-.03em;border-radius:16px;background:linear-gradient(180deg,#1D1F26,#15171C);border:1px solid rgba(255,255,255,.1);box-shadow:0 1px 0 rgba(255,255,255,.05) inset,0 10px 24px rgba(0,0,0,.4);font-variant-numeric:tabular-nums}
.opts button.good{background:var(--ok);border-color:var(--ok);color:#06210f}
.opts button.wrong{background:var(--bad);border-color:var(--bad);color:#2a0507}
.opts.lock button{pointer-events:none}
.fb{height:28px;text-align:center;font-weight:800;font-size:19px;margin-top:14px}
.fb.ok{color:var(--ok)}.fb.bad{color:var(--bad)}
/* 결과 */
.stars{font-size:46px;letter-spacing:6px;text-align:center;margin:6px 0 2px}
.stars .off{opacity:.18;filter:grayscale(1)}
.big{font-size:56px;font-weight:800;letter-spacing:-.05em;text-align:center;line-height:1.1;font-variant-numeric:tabular-nums}
.big small{font-size:20px;color:var(--gold);margin-left:4px}
.stat3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0 4px}
.stat3>div{background:#0F1014;border-radius:10px;padding:12px 6px;text-align:center}
.stat3 b{display:block;font-size:22px;letter-spacing:-.03em}.stat3 span{font-size:12px;color:var(--sub)}
.newrec{text-align:center;color:var(--gold);font-weight:800;margin-top:10px}
@media (max-width:360px){.q .eq{font-size:54px}.opts button{height:82px;font-size:30px}}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function () {
  var $app = document.getElementById('app');
  var ROUNDS = 10, SEC = 5, PAUSE = 900;
  var picked = [];            // 고른 단 (비어 있으면 전체)
  var G = null;               // 진행 중인 게임
  var KEY = 'castle-gugudan-best';

  function best() { try { return +localStorage.getItem(KEY) || 0; } catch (e) { return 0; } }
  function saveBest(v) { try { localStorage.setItem(KEY, String(v)); } catch (e) {} }
  function rnd(a, b) { return a + Math.floor(Math.random() * (b - a + 1)); }
  function shuffle(a) { for (var i = a.length - 1; i > 0; i--) { var j = rnd(0, i), t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function head() { return '<div class="top"><span class="brand"><img src="logo_mark.png" alt="캐슬"><b>캐슬 구구단</b></span></div>'; }

  // ---------- 시작 화면 ----------
  function home() {
    var all = picked.length === 0;
    var chips = '';
    for (var d = 2; d <= 9; d++) chips += '<button data-d="' + d + '" class="' + (picked.indexOf(d) >= 0 ? 'on' : '') + '">' + d + '단</button>';
    $app.innerHTML = head() +
      '<div class="hero"><div class="hi">5초 안에 눌러라!</div><h1>구구단 게임</h1><div class="tip">문제를 보고 알맞은 답을<br>3개 중에서 골라 누르세요.</div></div>' +
      '<div class="card"><h2>연습할 단</h2><div class="sub">고르지 않으면 2단부터 9단까지 모두 나옵니다.</div>' +
      '<div class="dans">' + chips + '<button class="all ' + (all ? 'on' : '') + '" data-d="all">전체 (2~9단)</button></div></div>' +
      '<div class="card best"><span>🏆 내 최고 점수</span><b>' + best() + '</b></div>' +
      '<button class="cta" id="go">▶ 게임 시작</button>';
    var bs = $app.querySelectorAll('.dans button');
    for (var i = 0; i < bs.length; i++) bs[i].onclick = function () {
      var v = this.getAttribute('data-d');
      if (v === 'all') picked = [];
      else { var n = +v, k = picked.indexOf(n); if (k >= 0) picked.splice(k, 1); else picked.push(n); if (picked.length === 8) picked = []; }
      home();
    };
    document.getElementById('go').onclick = start;
  }

  // ---------- 문제 만들기 ----------
  function deck() {
    var dans = picked.length ? picked.slice() : [2, 3, 4, 5, 6, 7, 8, 9], pool = [];
    dans.forEach(function (a) { for (var b = 2; b <= 9; b++) pool.push([a, b]); });
    shuffle(pool);
    var out = [];
    while (out.length < ROUNDS) {            // 단이 적으면 한 바퀴 더 돈다 (바로 앞 문제와는 다르게)
      shuffle(pool);
      for (var i = 0; i < pool.length && out.length < ROUNDS; i++) {
        var last = out[out.length - 1];
        if (last && last[0] === pool[i][0] && last[1] === pool[i][1]) continue;
        out.push(pool[i]);
      }
    }
    return out;
  }
  function choices(a, b) {                   // 정답 1개 + 그럴듯한 오답 2개
    var ans = a * b, c = {}, cand = [a * (b + 1), a * (b - 1), (a + 1) * b, (a - 1) * b, ans + 10, ans - 10, ans + 2, ans - 2, ans + 1, ans - 1];
    shuffle(cand);
    var wrong = [];
    for (var i = 0; i < cand.length && wrong.length < 2; i++) {
      var v = cand[i];
      if (v > 0 && v !== ans && !c[v]) { c[v] = 1; wrong.push(v); }
    }
    return shuffle([ans].concat(wrong));
  }

  // ---------- 게임 ----------
  function start() {
    G = { qs: deck(), i: 0, score: 0, right: 0, combo: 0, maxCombo: 0, t0: 0, raf: 0, lock: false, timer: 0 };
    show();
  }
  function show() {
    var q = G.qs[G.i], a = q[0], b = q[1], opts = choices(a, b);
    G.ans = a * b; G.lock = false;
    var btn = '';
    opts.forEach(function (v) { btn += '<button data-v="' + v + '">' + v + '</button>'; });
    $app.innerHTML = head() +
      '<div class="hud"><span class="n"><b>' + (G.i + 1) + '</b> / ' + ROUNDS + '</span><span class="sc">' + G.score + '<small>점</small></span></div>' +
      '<div class="tbar" id="tb"><i id="tf"></i></div>' +
      '<div class="card q"><div class="eq">' + a + '<span>×</span>' + b + '<span>=</span><em>?</em></div></div>' +
      '<div class="combo" id="cb">' + (G.combo >= 2 ? '🔥 ' + G.combo + '연속 정답!' : '') + '</div>' +
      '<div class="opts" id="op">' + btn + '</div><div class="fb" id="fb"></div>';
    var bs = document.querySelectorAll('#op button');
    for (var i = 0; i < bs.length; i++) bs[i].onclick = function () { answer(this); };
    G.t0 = performance.now();
    tick();
  }
  function tick() {
    var left = SEC - (performance.now() - G.t0) / 1000;
    var f = document.getElementById('tf');
    if (!f || G.lock) return;
    if (left <= 0) { f.style.transform = 'scaleX(0)'; answer(null); return; }
    f.style.transform = 'scaleX(' + (left / SEC) + ')';
    document.getElementById('tb').className = 'tbar' + (left <= 1.6 ? ' low' : '');
    G.raf = requestAnimationFrame(tick);
  }
  function answer(el) {
    if (G.lock) return;
    G.lock = true; cancelAnimationFrame(G.raf);
    var left = Math.max(0, SEC - (performance.now() - G.t0) / 1000);
    var ok = el && +el.getAttribute('data-v') === G.ans, fb = document.getElementById('fb');
    var op = document.getElementById('op'), bs = op.querySelectorAll('button');
    op.className = 'opts lock';
    for (var i = 0; i < bs.length; i++) if (+bs[i].getAttribute('data-v') === G.ans) bs[i].className = 'good';
    if (ok) {
      G.right++; G.combo++; G.maxCombo = Math.max(G.maxCombo, G.combo);
      var gain = 100 + Math.round(left * 20) + (G.combo >= 3 ? 20 : 0);
      G.score += gain; fb.className = 'fb ok'; fb.textContent = '정답! +' + gain;
    } else {
      G.combo = 0; if (el) el.className = 'wrong';
      fb.className = 'fb bad'; fb.textContent = el ? '아쉬워요! 정답은 ' + G.ans : '시간 초과! 정답은 ' + G.ans;
      if (navigator.vibrate) try { navigator.vibrate(70); } catch (e) {}
    }
    G.timer = setTimeout(function () { G.i++; if (G.i >= ROUNDS) result(); else show(); }, PAUSE);
  }

  // ---------- 결과 ----------
  function result() {
    var old = best(), isNew = G.score > old; if (isNew) saveBest(G.score);
    var st = G.right >= 10 ? 3 : G.right >= 8 ? 2 : G.right >= 5 ? 1 : 0, s = '';
    for (var i = 0; i < 3; i++) s += '<span class="' + (i < st ? '' : 'off') + '">⭐</span>';
    var msg = G.right === ROUNDS ? '완벽해요! 구구단 박사!' : G.right >= 8 ? '대단해요! 거의 다 맞혔어요.' : G.right >= 5 ? '잘했어요! 조금만 더 연습해요.' : '괜찮아요. 다시 도전해 봐요!';
    $app.innerHTML = head() +
      '<div class="card"><div class="stars">' + s + '</div><div class="sub" style="text-align:center;margin-bottom:10px">' + msg + '</div>' +
      '<div class="big">' + G.score + '<small>점</small></div>' + (isNew ? '<div class="newrec">🏆 새 최고 기록!</div>' : '') +
      '<div class="stat3"><div><b>' + G.right + ' / ' + ROUNDS + '</b><span>맞힌 문제</span></div><div><b>' + G.maxCombo + '</b><span>최고 연속</span></div><div><b>' + Math.max(old, G.score) + '</b><span>최고 점수</span></div></div></div>' +
      '<button class="cta" id="again">↻ 다시 하기</button><button class="cta ghost" id="back">처음으로</button>';
    document.getElementById('again').onclick = start;
    document.getElementById('back').onclick = home;
  }

  home();
})();
</script>
</body>
</html>
